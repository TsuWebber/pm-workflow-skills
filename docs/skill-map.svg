<svg xmlns="http://www.w3.org/2000/svg" width="680" height="770" viewBox="0 0 680 770" role="img" font-family="-apple-system, 'Segoe UI', 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif">
<title>pm-workflow 11 個 skill 的關聯圖</title>
<desc>由上到下：pm-setup 準備，接 pm-intake 與 pm-discover，匯入 pm-plan，再到 pm-spec。pm-spec 交給 pm-review 與 pm-design，兩者發現問題都回到 pm-spec；pm-review 通過後到 pm-ship、pm-ticket、pm-launch。左側是所有 skill 共用的 shared 與 pm-config，右上是獨立的 pm-report。</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
